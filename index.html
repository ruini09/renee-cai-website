
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RENEE CAI | Personal IP</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #8295ab;
      --blue: #3f72c2;
      --white: #ffffff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--white);
    }

    /* Full-screen hero */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 500px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(
          circle at center,
          rgba(207, 224, 243, 0.42),
          transparent 55%
        ),
        linear-gradient(135deg, #9baabb, #7188a2);
    }

    /* Technical grid */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.08) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.08) 1px,
          transparent 1px
        );
      background-size: 45px 45px;
      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 95%
      );
    }

    /* Navigation bar */
    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 82px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(75, 98, 125, 0.15);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    /* Blue circular R logo */
    .logo {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: var(--blue);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: Georgia, serif;
      font-size: 22px;
      font-style: italic;
      box-shadow: 0 0 20px rgba(63, 114, 194, 0.4);
    }

    .nav-link {
      color: white;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      position: relative;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      bottom: -7px;
      left: 0;
      width: 100%;
      height: 1px;
      background: white;
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .nav-link:hover::after {
      transform: scaleX(1);
    }

    /* Small technical labels */
    .eyebrow {
      position: absolute;
      top: 120px;
      left: 5%;
      font-size: 10px;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
    }

    .coordinates {
      position: absolute;
      top: 115px;
      right: 5%;
      text-align: right;
      font-family: monospace;
      font-size: 10px;
      line-height: 1.8;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.65);
    }

    /* Decorative circular technology motif */
    .orbit {
      position: absolute;
      width: min(75vw, 850px);
      aspect-ratio: 1;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 0 45px rgba(255, 255, 255, 0.025),
        0 0 0 90px rgba(255, 255, 255, 0.02);
      pointer-events: none;
      z-index: -1;
    }

    .orbit::before,
    .orbit::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 15px white;
    }

    .orbit::before {
      top: 18%;
      left: 16%;
    }

    .orbit::after {
      bottom: 17%;
      right: 13%;
    }

    /* Main oversized typography */
    .hero-title {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      transform: translateY(-50%);
      padding: 0 3%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
      font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;
      font-size: clamp(100px, 20.5vw, 310px);
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: 0.045em;
      text-transform: uppercase;
      white-space: nowrap;
      user-select: none;
    }

    .hero-title span {
      display: block;
      transform: scaleX(0.84);
    }

    .hero-title .renee {
      transform-origin: left center;
    }

    .hero-title .cai {
      transform-origin: right center;
    }

    /* Bottom captions */
    .bottom-caption {
      position: absolute;
      left: 5%;
      bottom: 35px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
    }

    .bottom-caption strong {
      font-size: 12px;
      color: white;
      letter-spacing: 1px;
    }

    .side-caption {
      position: absolute;
      right: 5%;
      bottom: 35px;
      writing-mode: vertical-rl;
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.8);
    }

    /* About section */
    .about {
      min-height: 55vh;
      padding: 100px 8%;
      background: #e9eef4;
      color: #24364b;
    }

    .about-label {
      margin-bottom: 20px;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .about h2 {
      max-width: 800px;
      font-size: clamp(36px, 6vw, 76px);
      line-height: 1.05;
      letter-spacing: -2px;
    }

    .about p {
      max-width: 580px;
      margin-top: 25px;
      color: #5e6e80;
      line-height: 1.8;
    }

    /* Mobile layout */
    @media (max-width: 700px) {
      .navbar {
        height: 68px;
        padding: 0 22px;
      }

      .eyebrow {
        top: 95px;
        left: 22px;
        font-size: 9px;
        letter-spacing: 2px;
      }

      .coordinates {
        top: 95px;
        right: 22px;
        font-size: 8px;
      }

      .hero-title {
        flex-direction: column;
        justify-content: center;
        gap: 18px;
        top: 50%;
        padding: 0;
        font-size: clamp(105px, 25vw, 180px);
        line-height: 0.75;
        letter-spacing: 0.04em;
      }

      .hero-title span {
        transform: scaleX(0.9);
      }

      .orbit {
        width: 110vw;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="hero" id="home">

    <nav class="navbar" aria-label="Main navigation">
      <a class="brand" href="#home">
        <span class="logo">R</span>
        <span>RENEE CAI</span>
      </a>

      <a class="nav-link" href="#about">
        About Me ↗
      </a>
    </nav>

    <div class="orbit" aria-hidden="true"></div>

    <h1 class="hero-title">
      <span class="renee">RENEE</span>
      <span class="cai">CAI</span>
    </h1>

  <section class="about" id="about">
    <div class="about-label">01 / About Me</div>

    <h2>
      A personal universe.
    </h2>

    <p>
      Welcome to my digital space. This is where I share my
      interests, creative projects, ideas, and personal journey.
    </p>
  </section>
</body>
</html>
